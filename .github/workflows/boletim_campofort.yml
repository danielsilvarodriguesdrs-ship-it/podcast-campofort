name: Boletim CampoFort Semanal

on:
  schedule:
    # TERÇA-FEIRA 18:00 BRT = 21:00 UTC — gera conteúdo, áudio e RSS (Spotify processa à noite)
    - cron: '0 21 * * 2'
    # QUARTA-FEIRA 05:30 BRT = 08:30 UTC — envia Telegram com link Spotify já publicado
    - cron: '30 8 * * 3'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo: full (gera+envia), generate (só gera), publish (só envia)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - generate
          - publish

jobs:
  boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install anthropic openai requests

      - name: Definir modo de execução
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "0 21 * * 2" ]]; then
            echo "MODE=generate" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "30 8 * * 3" ]]; then
            echo "MODE=publish" >> $GITHUB_ENV
          else
            echo "MODE=full" >> $GITHUB_ENV
          fi

      - name: Executar Boletim Runner
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:        ${{ github.repository }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}
          MODE:               ${{ env.MODE }}
        run: python scripts/boletim_runner.py

      - name: Commitar arquivos gerados
        run: |
          git config user.name  "CampoFort Bot"
          git config user.email "bot@campofort.com.br"
          git add output/ podcast_feed.xml docs/podcast_feed.xml episodes.json || true
          git diff --staged --quiet || \
            git commit -m "🌾 Boletim CampoFort — $(TZ='America/Sao_Paulo' date +'%d/%m/%Y') [${MODE}]"
          git push || true

      - name: Salvar arquivos como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boletim-${{ github.run_id }}
          path: |
            output/
            podcast_feed.xml
            episodes.json
          retention-days: 90
          if-no-files-found: warn
