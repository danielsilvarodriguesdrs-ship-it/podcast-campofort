name: Boletim CampoFort Semanal

on:
  schedule:
    # Toda quarta-feira às 06:00 BRT = 09:00 UTC
    - cron: '0 9 * * 3'
  workflow_dispatch:
    # Permite rodar manualmente pelo GitHub (útil para testar)

jobs:
  boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install anthropic openai requests

      - name: Executar Boletim Runner
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:        ${{ github.repository }}
        run: python scripts/boletim_runner.py

      - name: Commitar RSS feed e arquivos gerados
        run: |
          git config user.name  "CampoFort Bot"
          git config user.email "bot@campofort.com.br"
          git add output/ podcast_feed.xml docs/podcast_feed.xml episodes.json || true
          git diff --staged --quiet || \
            git commit -m "🌾 Boletim CampoFort — $(TZ='America/Sao_Paulo' date +'%d/%m/%Y')"
          git push || true

      - name: Salvar arquivos como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boletim-${{ github.run_id }}
          path: |
            output/
            podcast_feed.xml
            episodes.json
          retention-days: 90
          if-no-files-found: warn
