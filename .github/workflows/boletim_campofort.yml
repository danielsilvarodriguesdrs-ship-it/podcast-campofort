name: Boletim CampoFort Semanal

on:
  schedule:
    # TERÇA-FEIRA 18:00 BRT = 21:00 UTC — gera conteúdo, áudio e RSS (Spotify processa à noite)
    - cron: '0 21 * * 2'
    # QUARTA-FEIRA 06:00 BRT = 09:00 UTC — envia Telegram com link Spotify já publicado
    - cron: '0 9 * * 3'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo: full (gera+envia), generate (só gera), publish (só envia)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - generate
          - publish

jobs:
  boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install anthropic openai requests

      - name: Definir modo de execução
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "0 21 * * 2" ]]; then
            echo "MODE=generate" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == "0 9 * * 3" ]]; then
            echo "MODE=publish" >> $GITHUB_ENV
          else
            echo "MODE=full" >> $GITHUB_ENV
          fi

      - name: Executar Boletim Runner
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:        